<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="S3 Parquet Explorer - Aplicación web para explorar y analizar archivos Parquet en Amazon S3" />

    <!-- Primary Meta Tags -->
    <title>S3 Parquet Explorer</title>
    <meta name="title" content="S3 Parquet Explorer" />
    <meta name="description" content="Aplicación web moderna para explorar, visualizar y analizar archivos Parquet en Amazon S3" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://s3-parquet-explorer.example.com/" />
    <meta property="og:title" content="S3 Parquet Explorer" />
    <meta property="og:description" content="Aplicación web moderna para explorar, visualizar y analizar archivos Parquet en Amazon S3" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://s3-parquet-explorer.example.com/" />
    <meta property="twitter:title" content="S3 Parquet Explorer" />
    <meta property="twitter:description" content="Aplicación web moderna para explorar, visualizar y analizar archivos Parquet en Amazon S3" />
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <style>
        /* Preloader styles */
        #root {
            min-height: 100vh;
        }

        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .preloader-logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        .preloader-text {
            color: white;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            font-family: 'Inter', sans-serif;
        }

        .preloader-subtext {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Hide preloader when app loads */
        .preloader-hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div id="preloader" class="preloader">
        <div class="loading-spinner"></div>
        <div class="preloader-logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 2V8H20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16 13H8" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16 17H8" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10 9H9H8" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="preloader-text">S3 Parquet Explorer</div>
        <div class="preloader-subtext">Cargando aplicación...</div>
    </div>

    <!-- React App Container -->
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>

    <!-- Preloader script -->
    <script>
        // Hide preloader when page loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                var preloader = document.getElementById('preloader');
                if (preloader) {
                    preloader.classList.add('preloader-hidden');
                    setTimeout(function() {
                        preloader.style.display = 'none';
                    }, 500);
                }
            }, 1000);
        });

        // Fallback: hide preloader after 5 seconds
        setTimeout(function() {
            var preloader = document.getElementById('preloader');
            if (preloader && preloader.style.display !== 'none') {
                preloader.classList.add('preloader-hidden');
                setTimeout(function() {
                    preloader.style.display = 'none';
                }, 500);
            }
        }, 5000);
    </script>
</body>
</html>
