[package]
name = "s3-parquet-explorer"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.5"
actix-cors = "0.7"
aws-config = "1.1"
aws-sdk-s3 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
dotenv = "0.15"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
mime_guess = "2.0"
futures = "0.3"
bytes = "1.5"
url = "2.5"

# Polars 0.45
polars = { version = "0.45", features = [
    "parquet",
    "lazy", 
    "strings",
    "regex",
    "json",
    "csv",
    "temporal",
    "dtype-full",
    "dtype-time",
    "dtype-datetime"
] }

# DataFusion 43
datafusion = "43.0"
object_store = { version = "0.11.2", features = ["aws"] }

# ⭐ LA LLAVE: Forzar Chrono a la última versión que NO tiene conflicto
chrono = "=0.4.39"